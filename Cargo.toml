[package]
name = "ethonyx"
version = "0.2.5"
edition = "2024"
rust-version = "1.99"
description = "Lightweight Rust reverse proxy and health-check sidecar for Ethereum EL/CL nodes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DELIGHT-LABS/ethonyx"
readme = "README.md"
keywords = ["ethereum", "sidecar", "proxy", "reverse-proxy", "json-rpc", "beacon-api"]
categories = ["network-programming"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
hyper = { version = "1.12", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "aws-lc-rs", "webpki-tokio", "tls12"] }
http = "1.5"
bytes = "1.12"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Keep `smallvec` (avoids heap Vec fallback in JSON span/filter paths) and `tracing-log` (rustls/tungstenite bridge).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "smallvec", "fmt", "json", "env-filter", "tracing-log"] }
rustls = { version = "0.23.46" }
socket2 = "0.6"
opentelemetry = { version = "0.33.1", optional = true, default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", optional = true, default-features = false, features = ["trace", "metrics"] }
opentelemetry-http = { version = "0.33.1", optional = true, default-features = false }
opentelemetry-otlp = { version = "0.33.1", optional = true, default-features = false, features = ["http-proto", "internal-logs"] }
tracing-opentelemetry = { version = "0.34", optional = true, default-features = false }

[features]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-http", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dev-dependencies]
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["server-auto"] }
tokio = { version = "1.54.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

# Omit DWARF debuginfo on third-party crates while keeping full local debuginfo for CodeLLDB.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.release]
publish = false                                              # binary, not a crate
allow-branch = ["main"]                                      # release only from main
tag-message = "Release v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
pre-release-hook = ["cargo", "test", "--locked", "--all-features"] # gate before any state change
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased",             replace = "{{version}}",                              min = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate",            replace = "{{date}}",                                 min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->",   replace = "<!-- next-header -->\n## [Unreleased] - ReleaseDate\n", exactly = 1 },
]
